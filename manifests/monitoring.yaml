apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab-app
  namespace: lab
  labels:
    release: monitor
spec:
  selector:
    matchLabels:
      app: lab-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-app
  namespace: lab
  labels:
    release: monitor
spec:
  groups:
    - name: lab-app
      rules:
        - alert: LabDeploymentUnderReplicated
          expr: kube_deployment_spec_replicas{namespace="lab",deployment="lab-app"} < 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Lab application has fewer than two desired replicas
