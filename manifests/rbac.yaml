apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-reader
  namespace: lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-reader
  namespace: lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-reader
  namespace: lab
subjects:
  - kind: ServiceAccount
    name: lab-reader
    namespace: lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-reader
